name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      DBX_APP_KEY: ${{ secrets.DBX_APP_KEY }}
      DBX_APP_SECRET: ${{ secrets.DBX_APP_SECRET }}
      DBX_REFRESH_TOKEN: ${{ secrets.DBX_REFRESH_TOKEN }}
      DBX_TEST_MEMBER_EMAIL: ${{ secrets.DBX_TEST_MEMBER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install PowerShell 7.6 (.NET 10 host)
        # The runner's preinstalled pwsh runs on .NET 8 and cannot load this
        # net10.0 binary module (FileNotFoundException for System.Runtime
        # 10.0.0.0), which breaks help generation and the Pester suite. Install
        # a .NET 10 PowerShell build and prepend it to PATH so every later step
        # (and any pwsh child processes) resolves to it.
        run: |
          $version = '7.6.2'
          $url = "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "PowerShell-$version.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'pwsh-7.6'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dest | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Installed PowerShell $version to $dest"
      - name: Verify PowerShell runtime
        run: |
          Write-Host "pwsh version: $($PSVersionTable.PSVersion)"
          Write-Host "runtime: $([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription)"
      - name: Build and test
        run: |
          $args = @{ Configuration = 'Release'; IncludeLargeFileTests = $true }
          # When the repo's Dropbox secrets are unset (e.g. forks, first-time
          # setup), let the build proceed and run only the secret-leak guard
          # rather than failing the whole job.
          if (-not $env:DBX_APP_KEY -or -not $env:DBX_REFRESH_TOKEN) {
            Write-Host "::warning::Dropbox secrets not configured; running with -AllowMissingSecrets (integration tests will be skipped)."
            $args.AllowMissingSecrets = $true
          }
          ./build/Build-And-Test.ps1 @args
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**
            test/DbxProvider.Pester/TestResults/**
